<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: transparent; overflow: hidden; }
    #video-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="video" autoplay playsinline></video>
  </div>

  <script type="module">
    import { Room, RoomEvent, Track } from "https://cdn.jsdelivr.net/npm/livekit-client@2.6.0/+esm";

    let room;
    const videoEl = document.getElementById('video');

    window.connectAvatar = async (wsUrl, token) => {
      if (!wsUrl || !token) {
        if(window.Flutter) window.Flutter.postMessage("error: Missing URL/Token in JS function");
        return;
      }

      try {
        
        room = new Room({
          adaptiveStream: true,
          dynacast: true,
          videoCaptureDefaults: {
            resolution: { width: 1280, height: 720 }
          }
        });

        room.on(RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === Track.Kind.Video) {
            track.attach(videoEl);
            if(window.Flutter) window.Flutter.postMessage("video_ready");
          } else if (track.kind === Track.Kind.Audio) {
            const audioEl = track.attach();
            document.body.appendChild(audioEl);
            audioEl.play().catch(e => console.log("⚠️ [JS] Audio autoplay blocked:", e));
          }
        });
        
        room.on(RoomEvent.Disconnected, (reason) => {
             if(window.Flutter) window.Flutter.postMessage("disconnected");
        });

        await room.connect(wsUrl, token);
        
        try {
            await videoEl.play();
        } catch (e) {
            console.log("⚠️ [JS] Video Autoplay blocked:", e);
        }

      } catch (error) {
        if(window.Flutter) window.Flutter.postMessage("error: " + error.message);
      }
    };

    window.disconnectAvatar = () => {
      if (room) {
        room.disconnect();
      }
    };
  </script>
</body>
</html>
