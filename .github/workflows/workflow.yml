name: iOS-ipa-build

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS Build (No Code Signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Clean Flutter and Pods
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks

      - name: Flutter pub get
        run: flutter pub get

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Install Pods
        run: |
          cd ios
          pod repo update
          pod install --repo-update
          cd ..

      - name: Build iOS App (No Code Sign)
        run: |
          flutter build ios --release \
            --no-codesign \
            --verbose

      - name: Create IPA structure
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload
          ls -lh FlutterIpaExport.ipa

      - name: Upload IPA to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "🎉 Release IPA - Built without code signing"

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlutterIpaExport.ipa
          path: build/ios/iphoneos/FlutterIpaExport.ipa
          retention-days: 30